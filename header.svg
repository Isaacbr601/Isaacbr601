<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .dots-r { fill: #ff5f57; }
      .dots-y { fill: #febc2e; }
      .dots-g { fill: #28c840; }
      .bar { fill: #161b22; }
      .bar-text { fill: #484f58; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; }
      .ascii { fill: #58a6ff; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: bold; }
      .cursor { fill: #58a6ff; }
      .sub { fill: #8b949e; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
      .sub-hl { fill: #58a6ff; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
      .badge-bg { fill: #161b22; }
      .badge-border { fill: none; stroke: #30363d; stroke-width: 1; }
      .badge-text { fill: #8b949e; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; }
      .dot-green { fill: #28c840; }
      .dot-orange { fill: #ffa657; }

      .line1 { animation: reveal 0.01s 0.3s forwards; opacity: 0; }
      .line2 { animation: reveal 0.01s 0.5s forwards; opacity: 0; }
      .line3 { animation: reveal 0.01s 0.7s forwards; opacity: 0; }
      .line4 { animation: reveal 0.01s 0.9s forwards; opacity: 0; }
      .line5 { animation: reveal 0.01s 1.1s forwards; opacity: 0; }
      .line6 { animation: reveal 0.01s 1.3s forwards; opacity: 0; }
      .sub-line { animation: reveal 0.01s 1.6s forwards; opacity: 0; }
      .badges-row { animation: reveal 0.01s 2s forwards; opacity: 0; }
      .cur { animation: blink 0.8s step-end infinite; }

      @keyframes reveal { to { opacity: 1; } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="800" height="200" rx="12" class="bg"/>
  <rect x="0" y="0" width="800" height="28" rx="0" class="bar"/>
  <rect x="0" y="0" width="800" height="14" class="bar"/>
  <rect x="0" y="14" width="800" height="14" class="bar"/>
  <circle cx="18" cy="14" r="5" class="dots-r"/>
  <circle cx="34" cy="14" r="5" class="dots-y"/>
  <circle cx="50" cy="14" r="5" class="dots-g"/>
  <text x="340" y="19" text-anchor="middle" class="bar-text">~/Isaacbr601 — perfil</text>

  <text x="30" y="52" class="ascii line1"> ██╗███████╗ █████╗  █████╗  ██████╗</text>
  <text x="30" y="65" class="ascii line2"> ██║██╔════╝██╔══██╗██╔══██╗██╔════╝</text>
  <text x="30" y="78" class="ascii line3"> ██║███████╗███████║███████║██║     </text>
  <text x="30" y="91" class="ascii line4"> ██║╚════██║██╔══██║██╔══██║██║     </text>
  <text x="30" y="104" class="ascii line5"> ██║███████║██║  ██║██║  ██║╚██████╗</text>
  <text x="30" y="117" class="ascii line6"> ╚═╝╚══════╝╚═╝  ╚═╝╚═╝  ╚═╝ ╚═════╝</text>

